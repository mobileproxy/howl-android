name: Build Howl APK

on:
  workflow_dispatch:
    inputs:
      singbox_ref:
        description: "sing-box git ref to build libbox from"
        default: "dev-next"
  push:
    branches: [ dev ]
    paths:
      - ".github/workflows/build.yml"
      - "app/**"
      - "*.gradle.kts"
      - "version.properties"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Howl
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 28.0.13004108
        run: sdkmanager --install "ndk;28.0.13004108"

      - name: Build libbox.aar from sing-box (gomobile)
        run: |
          set -euxo pipefail
          REF="${{ github.event.inputs.singbox_ref || 'dev-next' }}"
          git clone --depth 1 --branch "$REF" https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          export PATH="$PATH:$(go env GOPATH)/bin"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.0.13004108"
          make lib_android
          echo "--- locate produced aar ---"
          find . -maxdepth 4 -name 'libbox*.aar' -print
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          AAR="$(find . -maxdepth 4 -name 'libbox.aar' | head -1)"
          test -n "$AAR"
          cp "$AAR" "$GITHUB_WORKSPACE/app/libs/libbox.aar"
          cp "$AAR" "$GITHUB_WORKSPACE/app/libs/libbox-legacy.aar"
          ls -la "$GITHUB_WORKSPACE/app/libs/"

      - name: Build APK (other flavor, debug)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.0.13004108"
          chmod +x ./gradlew
          ./gradlew :app:assembleOtherDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: howl-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
