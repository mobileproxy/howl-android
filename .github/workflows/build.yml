name: Build Howl APK

on:
  workflow_dispatch:
    inputs:
      singbox_ref:
        description: "sing-box-lx git ref to build libbox from"
        default: "v1.14.0-lx.5"
  push:
    branches: [ dev ]
    paths:
      - ".github/workflows/build.yml"
      - "app/**"
      - "*.gradle.kts"
      - "version.properties"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Howl
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"

      - name: Install Android NDK + platform (use runner's preinstalled SDK)
        run: |
          set -eu
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;28.0.13004108" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Build libbox.aar from sing-box-lx (gomobile, with_awg for AmneziaWG)
        run: |
          set -euxo pipefail
          REF="${{ github.event.inputs.singbox_ref || 'v1.14.0-lx.5' }}"
          git clone --depth 1 --branch "$REF" https://github.com/Leadaxe/sing-box-lx.git /tmp/sing-box
          cd /tmp/sing-box
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          export PATH="$PATH:$(go env GOPATH)/bin"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.0.13004108"
          make lib_android
          echo "--- locate produced aar ---"
          find . -maxdepth 4 -name 'libbox*.aar' -print
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          AAR="$(find . -maxdepth 4 -name 'libbox.aar' | head -1)"
          test -n "$AAR"
          cp "$AAR" "$GITHUB_WORKSPACE/app/libs/libbox.aar"
          cp "$AAR" "$GITHUB_WORKSPACE/app/libs/libbox-legacy.aar"
          ls -la "$GITHUB_WORKSPACE/app/libs/"

      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build APK (other flavor, RELEASE — signed + minified)
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.0.13004108"
          chmod +x ./gradlew
          ./gradlew :app:assembleOtherRelease --stacktrace --no-daemon

      - name: Upload APK (arm64-v8a only — small download)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: howl-apk
          path: app/build/outputs/apk/**/*arm64-v8a*.apk
          if-no-files-found: warn
