name: Build Howl APK

on:
  workflow_dispatch:
    inputs:
      singbox_ref:
        description: "sing-box-lx git ref to build libbox from"
        default: "v1.14.0-lx.29"
  push:
    branches: [ dev ]
    paths:
      - ".github/workflows/build.yml"
      - "app/**"
      - "*.gradle.kts"
      - "version.properties"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Howl
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"

      - name: Install Android NDK + platform (use runner's preinstalled SDK)
        run: |
          set -eu
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;28.0.13004108" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Build libbox.aar from sing-box-lx (gomobile, with_awg for AmneziaWG)
        run: |
          set -euxo pipefail
          REF="${{ github.event.inputs.singbox_ref || 'v1.14.0-lx.29' }}"
          git clone --depth 1 --branch "$REF" https://github.com/Leadaxe/sing-box-lx.git /tmp/sing-box
          cd /tmp/sing-box
          # Инициализируем ВСЕ подмодули из submodules/, какие объявлены в этой ревизии
          # ядра, и НЕ трогаем clients/* — это репозитории приложений, тяжёлые и для
          # сборки библиотеки не нужные.
          #
          # ★ Раньше здесь был жёстко прописан один wireguard-go, и на этом сломалась
          # пробная сборка на ядре lx.29: там к нему добавились sing-tun и gvisor, без
          # которых go падает с «reading submodules/gvisor/go.mod: no such file».
          # Список читаем из .gitmodules самой ревизии, поэтому рецепт одинаково годится
          # и для старого ядра (подмодуль один), и для любого будущего.
          git config -f .gitmodules --get-regexp '^submodule\..*\.path$' \
            | awk '$2 ~ /^submodules\// { print $2 }' \
            | xargs -r git submodule update --init --depth 1
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          export PATH="$PATH:$(go env GOPATH)/bin"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.0.13004108"
          # Keep logical module/line information without the native build machine's paths.
          export GOFLAGS="${GOFLAGS:-} -trimpath"
          make lib_android
          echo "--- locate produced aar ---"
          find . -maxdepth 4 -name 'libbox*.aar' -print
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          AAR="$(find . -maxdepth 4 -name 'libbox.aar' | head -1)"
          test -n "$AAR"
          cp "$AAR" "$GITHUB_WORKSPACE/app/libs/libbox.aar"
          cp "$AAR" "$GITHUB_WORKSPACE/app/libs/libbox-legacy.aar"
          ls -la "$GITHUB_WORKSPACE/app/libs/"

      - name: Verify both ARM cores
        run: |
          python3 -m unittest discover -s tools -p test_arm_libraries.py -v
          python3 -m unittest discover -s tools -p test_next_version_code.py -v
          python3 -m unittest discover -s tools -p test_apk_branding.py -v
          python3 tools/verify-arm-libraries.py app/libs/libbox.aar

      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build APK (other flavor, RELEASE — signed + minified)
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.0.13004108"
          export HOWL_VERSION_CODE=$(python3 tools/next-version-code.py)
          test -n "$HOWL_VERSION_CODE"
          chmod +x ./gradlew
          python3 tools/validate-candidate-resources.py
          # Юнит-тесты правил сторожа и разбора конфига — до сборки: провал останавливает выпуск.
          # Debug-вариант: в нём есть тестовая активность для скриншотов меню (Robolectric).
          ./gradlew :app:testOtherDebugUnitTest --stacktrace --no-daemon
          ./gradlew :app:assembleOtherRelease --stacktrace --no-daemon

      - name: Verify APK signature and upgrade compatibility
        run: |
          python3 tools/verify-release-apk.py app/build/outputs/apk/other/release
          APK=$(find app/build/outputs/apk/other/release -maxdepth 1 -name '*.apk' -print -quit)
          python3 tools/verify-apk-branding.py "$APK" --aapt "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"

      - name: Upload unit-test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && 7 || 1 }}
          name: howl-unit-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload settings screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && 7 || 1 }}
          name: howl-screenshots
          path: app/build/screenshots/
          if-no-files-found: warn

      - name: Upload verified universal ARM APK
        uses: actions/upload-artifact@v4
        with:
          retention-days: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && 7 || 1 }}
          name: howl-apk
          path: |
            app/build/outputs/apk/**/*universal*.apk
            app/build/outputs/apk/other/release/release-verification.json
          if-no-files-found: error
