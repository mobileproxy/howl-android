name: Diagnose rotation emulator environment

on:
  workflow_dispatch:
  push:
    branches: [android/signing-rotation]
    paths: ['.github/workflows/validate-rotation-emulators.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 30
            abi: armeabi-v7a
          - api: 35
            abi: arm64-v8a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Diagnose the same headless emulator launch without signing keys
        env:
          API: ${{ matrix.api }}
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          SDK="$ANDROID_SDK_ROOT"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install 'emulator' 'platform-tools' "system-images;android-$API;google_apis;x86_64" >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0 >/dev/null
          export ANDROID_AVD_HOME="$RUNNER_TEMP/howl-rotation-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
          "$SDK/emulator/emulator" -version || true
          "$SDK/emulator/emulator" -accel-check || true
          echo no | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd --name howl-rotation-diagnostic --package "system-images;android-$API;google_apis;x86_64" --device pixel_2 --force
          test -f "$ANDROID_AVD_HOME/howl-rotation-diagnostic.ini"
          "$SDK/emulator/emulator" -list-avds
          ADB="$SDK/platform-tools/adb"
          LOG="$RUNNER_TEMP/emulator.log"
          cleanup() {
            tail -n 100 "$LOG" || true
            "$ADB" -s emulator-5554 emu kill || true
          }
          trap cleanup EXIT
          "$SDK/emulator/emulator" -avd howl-rotation-diagnostic -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -memory 2048 >"$LOG" 2>&1 &
          PID=$!
          READY=0
          for N in $(seq 1 120); do
            kill -0 "$PID" || { wait "$PID"; exit 1; }
            if [ "$("$ADB" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then READY=1; break; fi
            sleep 2
          done
          test "$READY" = 1
          "$ADB" -s emulator-5554 shell getprop ro.product.cpu.abilist
          "$ADB" -s emulator-5554 shell getprop ro.dalvik.vm.native.bridge
          python3 - <<'PYBASELINE'
          import hashlib, os, pathlib, urllib.request
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'Howl-baseline.apk'
          urllib.request.urlretrieve('https://github.com/mobileproxy/howl-android/releases/download/ci-39134273181-1/Howl.apk', target)
          assert hashlib.sha256(target.read_bytes()).hexdigest() == 'fcefe8c5c4a5556a7b72bca7abb642043dce9eac6a49dc4ed984a1acd4df65ea'
          PYBASELINE
          "$ADB" -s emulator-5554 install --abi "$ABI" "$RUNNER_TEMP/Howl-baseline.apk"
          "$ADB" -s emulator-5554 logcat -c
          "$ADB" -s emulator-5554 shell am start -W -n how.vpn.howl/io.nekohasekai.sfa.compose.MainActivity
          sleep 5
          if ! "$ADB" -s emulator-5554 shell pidof how.vpn.howl; then
            "$ADB" -s emulator-5554 logcat -d -t 180
            exit 1
          fi
      # Read-only diagnostics only; no signing secrets, artifacts or release publication.
