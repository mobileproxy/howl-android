name: Diagnose native ARM Android environment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check unchanged public ARM APK on native ARM Android 13
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          SDK="$ANDROID_HOME"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install 'emulator' 'platform-tools' 'system-images;android-33;google_apis;arm64-v8a' >"$RUNNER_TEMP/sdk-images.log" 2>&1 || { cat "$RUNNER_TEMP/sdk-images.log"; exit 1; }
          export ANDROID_AVD_HOME="$RUNNER_TEMP/howl-rotation-native-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd --name howl-rotation-native --package 'system-images;android-33;google_apis;arm64-v8a' --device pixel_2 --force
          ADB="$SDK/platform-tools/adb"
          LOG="$RUNNER_TEMP/emulator.log"
          cleanup() {
            tail -n 100 "$LOG" || true
            "$ADB" -s emulator-5554 emu kill || true
          }
          trap cleanup EXIT
          # Standard hosted macOS VMs do not provide nested hardware virtualization.
          "$SDK/emulator/emulator" -avd howl-rotation-native -port 5554 -accel off -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -gpu swiftshader_indirect -memory 2048 >"$LOG" 2>&1 &
          PID=$!
          READY=0
          for N in $(seq 1 120); do
            kill -0 "$PID" || { wait "$PID"; exit 1; }
            if [ "$("$ADB" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then READY=1; break; fi
            sleep 2
          done
          test "$READY" = 1
          "$ADB" -s emulator-5554 shell getprop ro.product.cpu.abilist
          "$ADB" -s emulator-5554 shell getprop ro.dalvik.vm.native.bridge
          python3 - <<'PYBASELINE'
          import hashlib, os, pathlib, urllib.request
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'Howl-baseline.apk'
          urllib.request.urlretrieve('https://github.com/mobileproxy/howl-android/releases/download/ci-39134273181-1/Howl.apk', target)
          assert hashlib.sha256(target.read_bytes()).hexdigest() == 'fcefe8c5c4a5556a7b72bca7abb642043dce9eac6a49dc4ed984a1acd4df65ea'
          PYBASELINE
          "$ADB" -s emulator-5554 install "$RUNNER_TEMP/Howl-baseline.apk"
          "$ADB" -s emulator-5554 logcat -c
          "$ADB" -s emulator-5554 shell am start -W -n how.vpn.howl/io.nekohasekai.sfa.compose.MainActivity
          sleep 5
          if ! "$ADB" -s emulator-5554 shell pidof how.vpn.howl; then
            "$ADB" -s emulator-5554 shell dumpsys activity exit-info how.vpn.howl
            "$ADB" -s emulator-5554 logcat -b crash -d
            exit 1
          fi
      # No signing secrets, artifacts, releases or changes to installed user devices.
