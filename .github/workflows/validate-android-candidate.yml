name: Validate Android candidate

on:
  push:
    branches: [android/profile-safety-diagnostics, android/kill-switch-copy, android/integrated-candidate, android/server-check-progress, android/first-pass-location-checks, android/soft-switching, android/international-branding]
    paths:
      - "app/**"
      - ".github/workflows/validate-android-candidate.yml"
      - "tools/validate-candidate-resources.py"
      - "tools/verify-apk-branding.py"
      - "tools/test_apk_branding.py"
      - "tools/verify-signing-rotation-lab.py"
      - "tools/SigningRotationLab.java"

permissions:
  contents: read

concurrency:
  group: android-candidate-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Check combined candidate translations
        run: |
          python3 tools/validate-candidate-resources.py
          python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Prepare build tools for signed branding verification
        if: github.ref == 'refs/heads/android/international-branding'
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Fetch the existing core version (no core migration)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/howl-core app/libs
          gh release download v1.14.0-lx.29 --repo Leadaxe/sing-box-lx --pattern 'libbox-1.14.0-lx.29.aar' --pattern SHA256SUMS --dir /tmp/howl-core
          cd /tmp/howl-core
          grep 'libbox-1.14.0-lx.29.aar$' SHA256SUMS | sha256sum --check --strict
          cp libbox-1.14.0-lx.29.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"
      - name: Unit tests and unsigned debug build
        run: |
          chmod +x gradlew
          ./gradlew :app:testOtherDebugUnitTest :app:assembleOtherDebug --stacktrace --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g
      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'PYTEST'
          import glob, xml.etree.ElementTree as E
          totals = [0, 0, 0]
          for name in sorted(glob.glob('app/build/test-results/testOtherDebugUnitTest/TEST-*.xml')):
              root = E.parse(name).getroot()
              counts = [int(root.get(k, 0)) for k in ('tests', 'failures', 'errors')]
              totals = [a+b for a,b in zip(totals, counts)]
              if '.profile.' in root.get('name', '') or '.diagnostics.' in root.get('name', '') or '.connections.' in root.get('name', '') or 'ConnectionChecksUiTest' in root.get('name', ''):
                  print(root.get('name'), dict(zip(('tests', 'failures', 'errors'), counts)))
          print('ALL TESTS:', dict(zip(('tests', 'failures', 'errors'), totals)))
          PYTEST
      - name: Check minified candidate with the existing release signer
        if: github.ref == 'refs/heads/android/international-branding'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$LOCAL_PROPERTIES"
          trap 'rm -f app/release.keystore' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          export HOWL_VERSION_CODE=$(python3 tools/next-version-code.py)
          ./gradlew :app:assembleOtherRelease --stacktrace --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g
          python3 tools/verify-release-apk.py app/build/outputs/apk/other/release
          APK=$(find app/build/outputs/apk/other/release -maxdepth 1 -name '*.apk' -print -quit)
          python3 tools/verify-apk-branding.py "$APK" --aapt "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
      - name: Rehearse future rotation with disposable test keys only
        if: github.ref == 'refs/heads/android/international-branding'
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/other/release -maxdepth 1 -name '*.apk' -print -quit)
          python3 tools/verify-signing-rotation-lab.py "$APK" --build-tools "$ANDROID_SDK_ROOT/build-tools/36.0.0"
      # Signing uses the existing key only for this private candidate verification.
      # No artifact upload, release creation or deployment; contents permission is read-only.
