name: Validate Android candidate

on:
  push:
    branches: [android/profile-safety-diagnostics, android/kill-switch-copy, android/integrated-candidate, android/server-check-progress, android/first-pass-location-checks, android/soft-switching, android/international-branding, android/signing-rotation]
    paths:
      - "app/**"
      - ".github/workflows/validate-android-candidate.yml"
      - "tools/validate-candidate-resources.py"
      - "tools/verify-apk-branding.py"
      - "tools/test_apk_branding.py"
      - "tools/verify-signing-rotation-lab.py"
      - "tools/SigningRotationLab.java"
      - "tools/AndroidSigning.java"
      - "tools/signing-rotation.py"
      - "tools/test_signing_rotation.py"
      - "tools/test_release_signature_output.py"
      - "tools/verify-release-apk.py"
      - "tools/check-signing-rotation-fixtures.py"
      - "tools/check-rotation-upgrade.py"
      - "signing/**"

permissions:
  contents: read

concurrency:
  group: android-candidate-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Check combined candidate translations
        run: |
          python3 tools/validate-candidate-resources.py
          python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Prepare build tools for signed branding verification
        if: github.ref == 'refs/heads/android/international-branding' || github.ref == 'refs/heads/android/signing-rotation'
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Prepare or validate the pinned production lineage before building
        if: github.ref == 'refs/heads/android/signing-rotation'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          ANDROID_ROTATION_KEYSTORE_BASE64: ${{ secrets.ANDROID_ROTATION_KEYSTORE_BASE64 }}
          ANDROID_ROTATION_PROPERTIES: ${{ secrets.ANDROID_ROTATION_PROPERTIES }}
        run: python3 tools/signing-rotation.py create-lineage --build-tools "$ANDROID_SDK_ROOT/build-tools/36.0.0"
      - name: Fetch the existing core version (no core migration)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/howl-core app/libs
          gh release download v1.14.0-lx.29 --repo Leadaxe/sing-box-lx --pattern 'libbox-1.14.0-lx.29.aar' --pattern SHA256SUMS --dir /tmp/howl-core
          cd /tmp/howl-core
          grep 'libbox-1.14.0-lx.29.aar$' SHA256SUMS | sha256sum --check --strict
          cp libbox-1.14.0-lx.29.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"
      - name: Unit tests and unsigned debug build
        run: |
          chmod +x gradlew
          ./gradlew :app:testOtherDebugUnitTest :app:assembleOtherDebug --stacktrace --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g
      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'PYTEST'
          import glob, xml.etree.ElementTree as E
          totals = [0, 0, 0]
          for name in sorted(glob.glob('app/build/test-results/testOtherDebugUnitTest/TEST-*.xml')):
              root = E.parse(name).getroot()
              counts = [int(root.get(k, 0)) for k in ('tests', 'failures', 'errors')]
              totals = [a+b for a,b in zip(totals, counts)]
              if '.profile.' in root.get('name', '') or '.diagnostics.' in root.get('name', '') or '.connections.' in root.get('name', '') or 'ConnectionChecksUiTest' in root.get('name', ''):
                  print(root.get('name'), dict(zip(('tests', 'failures', 'errors'), counts)))
          print('ALL TESTS:', dict(zip(('tests', 'failures', 'errors'), totals)))
          PYTEST
      - name: Check minified candidate with the existing release signer
        if: github.ref == 'refs/heads/android/international-branding' || github.ref == 'refs/heads/android/signing-rotation'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$LOCAL_PROPERTIES"
          trap 'rm -f app/release.keystore' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          export HOWL_VERSION_CODE=$(python3 tools/next-version-code.py)
          ./gradlew :app:assembleOtherRelease --stacktrace --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g
          python3 tools/verify-release-apk.py app/build/outputs/apk/other/release
          APK=$(find app/build/outputs/apk/other/release -maxdepth 1 -name '*.apk' -print -quit)
          python3 tools/verify-apk-branding.py "$APK" --aapt "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
      - name: Rehearse future rotation with disposable test keys only
        if: github.ref == 'refs/heads/android/international-branding'
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/other/release -maxdepth 1 -name '*.apk' -print -quit)
          python3 tools/verify-signing-rotation-lab.py "$APK" --build-tools "$ANDROID_SDK_ROOT/build-tools/36.0.0"
      - name: Verify production rotation candidate without publishing
        if: github.ref == 'refs/heads/android/signing-rotation'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          ANDROID_ROTATION_KEYSTORE_BASE64: ${{ secrets.ANDROID_ROTATION_KEYSTORE_BASE64 }}
          ANDROID_ROTATION_PROPERTIES: ${{ secrets.ANDROID_ROTATION_PROPERTIES }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/other/release -maxdepth 1 -name '*universal*.apk' -print -quit)
          python3 tools/signing-rotation.py sign --apk "$APK" --output "$RUNNER_TEMP/Howl-rotated.apk" --build-tools "$ANDROID_SDK_ROOT/build-tools/36.0.0"
          mv "$RUNNER_TEMP/Howl-rotated.apk" "$APK"
      - name: Verify the rotated candidate without signing secrets
        if: github.ref == 'refs/heads/android/signing-rotation'
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/other/release -maxdepth 1 -name '*universal*.apk' -print -quit)
          HOWL_SIGNING_MODE=rotated python3 tools/verify-release-apk.py app/build/outputs/apk/other/release
          python3 tools/verify-apk-branding.py "$APK" --aapt "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
      - name: Reject wrong signing identity and modified APK using disposable fixtures
        if: github.ref == 'refs/heads/android/signing-rotation'
        run: |
          APK=$(find app/build/outputs/apk/other/release -maxdepth 1 -name '*universal*.apk' -print -quit)
          python3 tools/check-signing-rotation-fixtures.py "$APK" --build-tools "$ANDROID_SDK_ROOT/build-tools/36.0.0" --java-home "$JAVA_HOME"
      - name: Prepare the following signed version for upgrade acceptance
        if: github.ref == 'refs/heads/android/signing-rotation'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/other/release -maxdepth 1 -name '*universal*.apk' -print -quit)
          cp "$APK" "$RUNNER_TEMP/Howl-candidate.apk"
          trap 'rm -f app/release.keystore' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          export HOWL_VERSION_CODE=$(python3 tools/next-version-code.py)
          HOWL_VERSION_CODE=$((HOWL_VERSION_CODE + 1))
          ./gradlew :app:assembleOtherRelease --stacktrace --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g
      - name: Sign the following version with the same lineage
        if: github.ref == 'refs/heads/android/signing-rotation'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          ANDROID_ROTATION_KEYSTORE_BASE64: ${{ secrets.ANDROID_ROTATION_KEYSTORE_BASE64 }}
          ANDROID_ROTATION_PROPERTIES: ${{ secrets.ANDROID_ROTATION_PROPERTIES }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/other/release -maxdepth 1 -name '*universal*.apk' -print -quit)
          python3 tools/signing-rotation.py sign --apk "$APK" --output "$RUNNER_TEMP/Howl-next.apk" --build-tools "$ANDROID_SDK_ROOT/build-tools/36.0.0"
          cp "$RUNNER_TEMP/Howl-next.apk" "$APK"
      - name: Verify the following version without signing secrets
        if: github.ref == 'refs/heads/android/signing-rotation'
        run: |
          HOWL_SIGNING_MODE=rotated python3 tools/verify-release-apk.py app/build/outputs/apk/other/release
      - name: Check PackageInstaller upgrades and synthetic profiles on Android 11 and 13
        if: github.ref == 'refs/heads/android/signing-rotation'
        run: |
          set -euo pipefail
          python3 - <<'PYBASELINE'
          import hashlib, os, pathlib, urllib.request
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'Howl-baseline.apk'
          urllib.request.urlretrieve('https://github.com/mobileproxy/howl-android/releases/download/ci-39134273181-1/Howl.apk', target)
          assert hashlib.sha256(target.read_bytes()).hexdigest() == 'fcefe8c5c4a5556a7b72bca7abb642043dce9eac6a49dc4ed984a1acd4df65ea'
          PYBASELINE
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install 'emulator' 'platform-tools' 'system-images;android-30;google_apis;x86_64' 'system-images;android-33;google_apis;x86_64' >/dev/null
          ADB="$ANDROID_SDK_ROOT/platform-tools/adb"
          for API in 30 33; do
            AVD="howl-rotation-$API"
            echo no | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" create avd --name "$AVD" --package "system-images;android-$API;google_apis;x86_64" --device pixel_2 --force
            "$ANDROID_SDK_ROOT/emulator/emulator" -avd "$AVD" -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -memory 2048 >"$RUNNER_TEMP/emulator-$API.log" 2>&1 &
            EMULATOR_PID=$!
            trap '"$ADB" -s emulator-5554 emu kill || true' EXIT
            timeout 180 "$ADB" -s emulator-5554 wait-for-device
            BOOTED=0
            for N in $(seq 1 120); do
              if [ "$("$ADB" -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then BOOTED=1; break; fi
              sleep 2
            done
            test "$BOOTED" = 1
            python3 tools/check-rotation-upgrade.py --adb "$ADB" --baseline "$RUNNER_TEMP/Howl-baseline.apk" --candidate "$RUNNER_TEMP/Howl-candidate.apk" --next "$RUNNER_TEMP/Howl-next.apk"
            "$ADB" -s emulator-5554 emu kill
            wait "$EMULATOR_PID" || true
            trap - EXIT
          done
      # Candidate signing is confined to step-scoped secrets; production signing uses memory only.
      # No artifact upload, release creation or deployment; contents permission is read-only.
