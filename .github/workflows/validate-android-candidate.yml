name: Validate Android candidate

on:
  push:
    branches: [android/profile-safety-diagnostics, android/kill-switch-copy]
    paths:
      - "app/**"
      - ".github/workflows/validate-android-candidate.yml"

permissions:
  contents: read

concurrency:
  group: android-candidate-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Fetch the existing core version (no core migration)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/howl-core app/libs
          gh release download v1.14.0-lx.29 --repo Leadaxe/sing-box-lx --pattern 'libbox-1.14.0-lx.29.aar' --pattern SHA256SUMS --dir /tmp/howl-core
          cd /tmp/howl-core
          grep 'libbox-1.14.0-lx.29.aar$' SHA256SUMS | sha256sum --check --strict
          cp libbox-1.14.0-lx.29.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"
      - name: Unit tests and unsigned debug build
        run: |
          chmod +x gradlew
          ./gradlew :app:testOtherDebugUnitTest :app:assembleOtherDebug --stacktrace --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g
      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'PYTEST'
          import glob, xml.etree.ElementTree as E
          totals = [0, 0, 0]
          for name in sorted(glob.glob('app/build/test-results/testOtherDebugUnitTest/TEST-*.xml')):
              root = E.parse(name).getroot()
              counts = [int(root.get(k, 0)) for k in ('tests', 'failures', 'errors')]
              totals = [a+b for a,b in zip(totals, counts)]
              if '.profile.' in root.get('name', '') or '.diagnostics.' in root.get('name', ''):
                  print(root.get('name'), dict(zip(('tests', 'failures', 'errors'), counts)))
          print('ALL TESTS:', dict(zip(('tests', 'failures', 'errors'), totals)))
          PYTEST
      # No signing secrets, artifact upload, release creation or deployment.
